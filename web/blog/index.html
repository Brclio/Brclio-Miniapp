<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefcf6">
  <meta name="description" content="Brclio 的文字空间：记录编程、学习和生活。网页与小程序共同阅读，收藏值得重读的文字。">
  <title>博客 · Brclio 悦创</title>
  <link rel="icon" href="/projects/ready-go-duel/assets/avatar.png" type="image/png">
  <link rel="stylesheet" href="/blog/style.css">
  <script src="/account-runtime.js" defer></script>
  <script src="/blog/content.js" defer></script>
  <script src="/blog/cache.js" defer></script>
  <script src="/blog/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#blog-main">跳到主要内容</a>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Brclio 悦创首页"><span class="brand-mark" aria-hidden="true">b.</span><span>Brclio <small>悦创 · 博客</small></span></a>
    <nav class="header-actions" aria-label="主要导航"><a href="/" class="home-entry">悦创首页</a><a id="account-entry" href="/?category=mine">登录 / 注册 ↗</a></nav>
  </header>
  <div class="app-shell">
    <section id="channel-profile" class="channel-profile" aria-labelledby="list-title">
      <img class="channel-avatar" src="/projects/ready-go-duel/assets/avatar.png" alt="Brclio 的头像" width="64" height="64">
      <div class="channel-intro"><p class="profile-caption">BRCLIO JOURNAL</p><h1 id="list-title">Brclio 的文字</h1><p id="list-description">写代码，教编程，做产品。记录学习与生活。</p></div>
      <span class="channel-signature" aria-hidden="true">Stay curious.</span>
    </section>
    <nav class="tab-bar" aria-label="博客导航"><a class="tab active" href="/blog/" data-view="list">全部文章</a><a class="tab" href="/blog/?view=saved" data-view="saved">我的收藏</a><a class="tab" href="/blog/?view=admin" data-view="admin" hidden>文章管理</a><a class="tab write-entry" href="/blog/?view=write" data-view="write" hidden>写篇文章</a><button id="refresh-blog" class="text-button refresh-entry" type="button" title="重新读取最新文章" aria-label="刷新内容"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-6v6h6M4 13a8 8 0 0 0 14 5l3-3m0 6v-6h-6"/></svg><span>刷新</span></button></nav>
    <main id="blog-main" class="app-content" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section id="blog-list" aria-labelledby="list-title">
        <div class="listing-layout"><aside class="collection-aside"><form id="search-form" role="search"><label for="search" class="sr-only">搜索文章</label><div class="search-row"><button type="submit" aria-label="搜索文章"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><input id="search" name="q" type="search" maxlength="100" placeholder="搜索文章、标签"></div></form><h2 class="filter-title">文章分类</h2><div id="categories" class="category-list"></div><h2 class="filter-title tag-heading">标签</h2><div id="tags" class="tag-list"></div><p class="aside-note">写下所学，<br>也留住好奇。</p></aside><div class="listing-content"><div class="collection-toolbar"><p id="result-count" aria-live="polite"></p><button id="clear-filters" class="text-button" type="button" hidden>清除筛选</button></div><div id="posts" class="post-list" aria-live="polite"></div><div id="pagination" class="pagination" aria-label="文章翻页"></div></div></div>
      </section>
      <section id="blog-reader" hidden aria-labelledby="post-title"></section>
      <section id="blog-editor" hidden aria-labelledby="editor-title"></section>
    </main>
    <footer class="site-footer"><a href="https://brclio.com">Brclio</a><span>Stay curious. Keep building.</span><a href="/blog/">回到文章列表 ↑</a></footer>
  </div>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-panel">
      <span class="confirm-mark" aria-hidden="true">b.</span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-subject" class="confirm-subject" hidden></p>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="secondary" type="button" autofocus>取消</button>
        <button id="confirm-accept" class="primary" type="button">确认</button>
      </div>
    </div>
  </dialog>
  <!-- Adapted from Brclio Design System app template. © Brclio, CC BY-NC-SA 4.0. -->
</body>
</html>
