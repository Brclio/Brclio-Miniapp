<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefcf6">
  <meta name="description" content="Brclio 的文字空间：记录编程、学习和生活。网页与小程序共同阅读，收藏值得重读的文字。">
  <title>博客 · Brclio 悦创</title>
  <link rel="icon" href="/projects/ready-go-duel/assets/avatar.png" type="image/png">
  <link rel="stylesheet" href="/blog/style.css">
  <script src="/account-runtime.js" defer></script>
  <script src="/blog/content.js" defer></script>
  <script src="/blog/cache.js" defer></script>
  <script src="/blog/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#blog-main">跳到主要内容</a>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Brclio 悦创首页"><span class="brand-mark" aria-hidden="true">b.</span><span>Brclio <small>悦创 / JOURNAL</small></span></a>
    <nav class="header-actions" aria-label="主要导航"><a href="/">悦创首页</a><a href="/blog/" aria-current="page">博客</a><a id="account-entry" href="/?category=mine">登录 / 注册 ↗</a></nav>
  </header>
  <div class="app-shell">
    <nav class="tab-bar" aria-label="博客导航"><a class="tab active" href="/blog/" data-view="list">所有文章</a><a class="tab" href="/blog/?view=saved" data-view="saved">我的收藏</a><a class="tab" href="/blog/?view=admin" data-view="admin" hidden>文章管理</a><a class="tab write-entry" href="/blog/?view=write" data-view="write" hidden>写篇文章 ↗</a><button id="refresh-blog" class="text-button refresh-entry" type="button" title="重新读取最新文章与留言">刷新内容 ↻</button></nav>
    <main id="blog-main" class="app-content" tabindex="-1">
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section id="blog-list" aria-labelledby="list-title">
        <div class="page-heading"><div><p class="eyebrow">NOTES ON LEARNING & LIVING</p><h1 id="list-title">留一点文字，给好奇心。</h1><p class="intro-description" id="list-description">写代码，教编程，做产品。也记下生活里的小发现。</p></div><span class="heading-mark" aria-hidden="true">✳</span></div>
        <div class="listing-layout"><aside class="collection-aside"><form id="search-form" role="search"><label for="search">寻找一篇文章</label><div class="search-row"><input id="search" name="q" type="search" maxlength="100" placeholder="标题、摘要或标签"><button type="submit" aria-label="搜索文章">↗</button></div></form><h2 class="filter-title">按分类阅读</h2><div id="categories" class="category-list"></div><h2 class="filter-title">文字的线索</h2><div id="tags" class="tag-list"></div><p class="aside-note">值得重读的，<br>就先收藏起来。</p></aside><div class="listing-content"><div class="collection-toolbar"><p id="result-count" aria-live="polite"></p><button id="clear-filters" class="text-button" type="button" hidden>清除筛选</button></div><div id="posts" class="post-list" aria-live="polite"></div><div id="pagination" class="pagination" aria-label="文章翻页"></div></div></div>
      </section>
      <section id="blog-reader" hidden aria-labelledby="post-title"></section>
      <section id="blog-editor" hidden aria-labelledby="editor-title"></section>
    </main>
    <footer class="site-footer"><a href="https://brclio.com">Brclio</a><span>Stay curious. Keep building.</span><a href="/blog/">回到文章列表 ↑</a></footer>
  </div>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-panel">
      <span class="confirm-mark" aria-hidden="true">b.</span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-subject" class="confirm-subject" hidden></p>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="secondary" type="button" autofocus>取消</button>
        <button id="confirm-accept" class="primary" type="button">确认</button>
      </div>
    </div>
  </dialog>
  <!-- Adapted from Brclio Design System app template. © Brclio, CC BY-NC-SA 4.0. -->
</body>
</html>
